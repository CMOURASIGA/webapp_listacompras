<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003b73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="7Mercado">
    <title>7Mercado | Consult Services</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v3.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tokens do design system Consult Services (mesma paleta/raio/sombra do
        // 7Eventos e 7Commander) para que o 7Mercado seja reconhecível como
        // produto da mesma plataforma.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e1f4fc', 100: '#cdecfa', 200: '#a8def6', 300: '#7cd0f2', 400: '#3dbdec',
                            500: '#00aeef', 600: '#003b73', 700: '#002f5c', 800: '#002952', 900: '#001a35',
                        },
                        // 300 = tom claro usado só como texto/ícone sobre fundo escuro (modo escuro);
                        // 50/500/700 seguem o design system Consult Services original.
                        success: { 50: '#e1f5ee', 300: '#6fd3a8', 500: '#1d9e75', 700: '#0f6e56' },
                        warning: { 50: '#faeeda', 300: '#e6b96a', 500: '#c17f1a', 700: '#854f0b' },
                        danger: { 50: '#fcebeb', 300: '#e8938c', 500: '#c0453d', 700: '#a32d2d' },
                        info: { 50: '#e1f4fc', 300: '#7cd0f2', 500: '#00aeef', 700: '#003b73' },
                    },
                    borderRadius: { sm: '10px', md: '16px', lg: '22px' },
                    boxShadow: {
                        sm: '0 1px 2px rgba(0, 41, 82, 0.06)',
                        md: '0 16px 32px -24px rgba(0, 59, 115, 0.32)',
                    },
                },
            },
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tabs-container {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        .tab {
            flex: 0 0 auto;
            min-width: max-content;
            padding: 0 16px;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        /* list-none do Tailwind não cobre o marcador nativo do <summary> no Safari/Chrome */
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
